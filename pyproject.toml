[project]
name = "panlabs-meta"
version = "0.1.0"
description = "Mecanismos que aplicam e verificam o padrao panlabs na org panlabs-tech."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
panlabs-ruleset = "panlabs.ruleset.cli:main"
panlabs-org = "panlabs.org.cli:main"
panlabs-checker = "panlabs.checker.cli:main"
panlabs-machine = "panlabs.machine.cli:main"

[dependency-groups]
# `pyyaml` e os seus stubs sao dependencia de teste, nao de runtime: parte da
# configuracao versionada deste repo (o `dependabot.yml` e os workflows) so
# existe em YAML porque o GitHub exige esse formato, e o teste que a verifica
# precisa le-la de verdade. Nenhum script importa `yaml`.
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/panlabs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
# Corpo de API do GitHub e JSON arbitrario: `Any` e o tipo honesto, nao uma folga.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]

[tool.pyright]
include = ["scripts", "tests"]
# `tests/` e raiz de import para o pytest (nao tem __init__.py), e por isso um
# helper como `shipped.py` e importavel de qualquer teste. Sem esta linha o
# pyright nao resolveria esse import, que em execucao funciona.
extraPaths = ["tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# A fronteira com a API do GitHub e JSON sem esquema: ali `Any` e o tipo honesto,
# e exigir tipo conhecido so produziria anotacao decorativa. O tipo passa a valer
# de verdade em `ruleset/model.py`, que e onde o JSON vira estado observado.
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
